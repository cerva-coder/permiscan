[project]
name = "permiscan"
version = "0.1.0"
description = "Auditoria de controle de acesso e exposição de dados em bancos, BaaS e nuvem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.12",
    "rich>=13.0.0",
]

[project.scripts]
permiscan = "permiscan.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
